<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随身书斋 - 完美兼容版</title>
    <style>
        :root {
            --bg-color: #f6f1e5; 
            --text-color: #2c2519;
            --sidebar-bg: #eddcc4;
            --font-size: 19px;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
            display: flex;
            transition: background 0.3s, color 0.3s;
        }

        /* 侧边栏目录 */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background-color: var(--sidebar-bg);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 999;
            transition: left 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .sidebar.open { left: 0; }
        
        .sidebar-header {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .catalog-list {
            overflow-y: auto;
            flex: 1;
            padding: 10px 0;
            list-style: none;
            margin: 0;
        }
        .catalog-item {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .catalog-item:hover { background: rgba(0,0,0,0.05); }
        .catalog-item.active { font-weight: bold; color: #8b4513; }

        /* 主体阅读区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-width: 0;
        }

        /* 顶部控制栏 */
        .controls {
            position: fixed;
            top: 0;
            width: 100%;
            max-width: 700px;
            background: var(--bg-color);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .btn {
            background: rgba(0,0,0,0.05);
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-color);
        }
        .btn:hover { background: rgba(0,0,0,0.1); }

        /* 书籍展示容器 */
        .reader-container {
            max-width: 720px;
            width: 100%;
            margin-top: 70px;
            margin-bottom: 40px;
            font-size: var(--font-size);
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: justify;
        }

        .chapter-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(0,0,0,0.08);
            color: #8b4513;
        }

        /* 翻页按钮 */
        .page-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 60px;
            width: 100%;
            max-width: 720px;
            justify-content: space-between;
        }
        .page-nav .btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            text-align: center;
        }

        /* 夜间模式 */
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #a0a0a0;
            --sidebar-bg: #242424;
        }
        body.dark-mode .btn { background: rgba(255,255,255,0.1); color: #a0a0a0; }
        body.dark-mode .catalog-item.active { color: #fff; }
        body.dark-mode .chapter-title { color: #d2b48c; border-bottom-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>书籍目录</span>
            <button class="btn" onclick="toggleSidebar()">关闭</button>
        </div>
        <ul class="catalog-list" id="catalog-list"></ul>
    </div>

    <div class="main-content">
        <div class="controls">
            <button class="btn" onclick="toggleSidebar()">📖 目录</button>
            <div>
                <button class="btn" onclick="changeFontSize(1)">A+</button>
                <button class="btn" onclick="changeFontSize(-1)">A-</button>
                <button class="btn" onclick="toggleDarkMode()">🌗 模式</button>
            </div>
        </div>

        <div class="reader-container" id="book-content">
            正在为您智能分章，请稍候...
        </div>

        <div class="page-nav">
            <button class="btn" onclick="prevChapter()">上一章</button>
            <button class="btn" onclick="nextChapter()">下一章</button>
        </div>
    </div>

    <script>
        const contentDiv = document.getElementById('book-content');
        const catalogList = document.getElementById('catalog-list');
        const sidebar = document.getElementById('sidebar');
        
        // 匹配章节标题的正则表达式
        const chapterRegex = /^\s*(第[\u4e00-\u9fa5\d]+章.*|（[\u4e00-\u9fa5\d]+）|第\d+章.*)\s*$/;

        let chapters = [];      
        let currentIdx = 0;     

        async function initBook() {
            try {
                const response = await fetch('book.txt');
                if (!response.ok) throw new Error('未找到 book.txt 文件');
                const text = await response.text();
                
                // 按行切分
                const lines = text.split('\n');
                
                let tempChapters = [];
                let currentChapter = { title: "前言/引言", content: [] };
                
                // 1. 预解析：初步把文本塞进各个章节
                lines.forEach((line) => {
                    if (chapterRegex.test(line)) {
                        if (currentChapter.content.length > 0 || currentChapter.title !== "前言/引言") {
                            tempChapters.push(currentChapter);
                        }
                        currentChapter = { title: line.trim(), content: [] };
                    } else {
                        currentChapter.content.push(line);
                    }
                });
                if (currentChapter.content.length > 0 || currentChapter.title !== "前言/引言") {
                    tempChapters.push(currentChapter);
                }

                // 2. 核心过滤：剔除小说开头连续且没有正文内容的“纯目录索引行”
                chapters = tempChapters.filter(ch => {
                    // 把章节内容里的空行、空格去掉，看看还有没有字
                    const structuralText = ch.content.join('').replace(/\s+/g, '');
                    // 如果该章节叫“第xx章”，但是里面一个字正文都没有，说明它是开头目录页的一部分，直接过滤掉
                    if (chapterRegex.test(ch.title) && structuralText.length === 0) {
                        return false; 
                    }
                    return true;
                });

                // 如果连“前言/引言”也全空，就给个保底
                if (chapters.length === 0) {
                    chapters = [{ title: "开始阅读", content: lines }];
                }

                // 3. 渲染目录
                renderCatalog();

                // 4. 读取历史进度
                const savedIdx = localStorage.getItem('current_chapter_idx_v3');
                currentIdx = savedIdx ? parseInt(savedIdx) : 0;
                if(currentIdx >= chapters.length || currentIdx < 0) currentIdx = 0;

                renderChapter(currentIdx);

            } catch (error) {
                contentDiv.innerText = "加载失败: " + error.message + "。请确认文件名是否为 book.txt";
            }
        }

        // 渲染目录列表
        function renderCatalog() {
            catalogList.innerHTML = '';
            chapters.forEach((ch, index) => {
                const li = document.createElement('li');
                li.className = 'catalog-item';
                li.id = `cat-${index}`;
                li.innerText = ch.title;
                li.onclick = () => {
                    toggleSidebar();
                    renderChapter(index);
                };
                catalogList.appendChild(li);
            });
        }

        // 仅渲染当前章节的正文
        function renderChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            
            currentIdx = index;
            localStorage.setItem('current_chapter_idx_v3', currentIdx); 

            // 更新目录高亮
            document.querySelectorAll('.catalog-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`cat-${index}`);
            if (activeItem) activeItem.classList.add('active');

            // 渲染正文
            const ch = chapters[index];
            contentDiv.innerHTML = `<div class="chapter-title">${ch.title}</div>` + ch.content.join('\n');
            
            // 切换章节后自动回到顶部
            window.scrollTo(0, 0);
        }

        function prevChapter() {
            if (currentIdx > 0) renderChapter(currentIdx - 1);
            else alert("已经是第一章了！");
        }

        function nextChapter() {
            if (currentIdx < chapters.length - 1) renderChapter(currentIdx + 1);
            else alert("已经是最后一章了！");
        }

        function toggleSidebar() { sidebar.classList.toggle('open'); }

        let currentFontSize = 19;
        function changeFontSize(delta) {
            currentFontSize += delta;
            currentFontSize = Math.max(14, Math.min(32, currentFontSize));
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

        window.onload = initBook;
    </script>
</body>
</html>
